on:
  push:
    branches: [main]
  workflow_dispatch: {}

name: build-and-deploy-shinylive

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: shinylive-pages
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install shinylive
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            cran::shinylive
            local::.

      # Export only the app sources. Exporting the repo root would also copy
      # test_app/ into the site (that is why upstream's app.json is ~129 MB).
      - name: Stage app sources
        run: |
          mkdir -p _src
          cp app.R DESCRIPTION _src/
          cp -R www _src/

      - name: Export Shinylive site
        shell: Rscript {0}
        run: shinylive::export("_src", "_site")

      - name: Add .nojekyll
        run: touch _site/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy Shinylive build from ${{ github.sha }}"
